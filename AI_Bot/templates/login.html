{% extends "base.html" %}

{% block title %}Sign in — RX{% endblock %}

{% block shell %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <span class="brand-mark large">R</span>
            <h1>RX</h1>
            <p>Your private AI workspace</p>
        </div>

        <form class="auth-form" method="post" action="/login">

            <input type="hidden" name="next" value="{{ next_url }}">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Your username"
                value="{{ username | default('') }}"
                autocomplete="username"
                autofocus
                required
            >

            <label for="password">Password</label>

            <div class="password-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" id="show-password" class="password-toggle" aria-label="Show password">Show</button>
            </div>

            {% if error %}
                <p class="login-error" role="alert">
                    <svg class="icon"><use href="#i-info"/></svg> {{ error }}
                </p>
            {% endif %}

            <button type="submit" class="btn primary full">Sign in</button>

            <a class="auth-forgot" href="/forgot-password">Forgot password?</a>

        </form>

        <div class="auth-foot">
            <svg class="icon"><use href="#i-shield"/></svg>
            <span>Private — password protected</span>
        </div>

    </div>

</div>

{% endblock %}
